terrain_pointcloud_filter_node:
  ros__parameters:
    input_topic: /camera/points
    output_topic: /terrain/filtered_points
    target_frame: odom
    base_frame: base_footprint
    publish_rate: 5.0
    voxel_size: 0.03
    min_range: 0.15
    max_range: 4.0
    crop_min_x: 0.10
    crop_max_x: 3.60
    crop_min_y: -2.0
    crop_max_y: 2.0
    crop_min_z: -0.60
    crop_max_z: 1.20
    remove_rover_body: true
    rover_exclusion_min_x: -0.25
    rover_exclusion_max_x: 0.30
    rover_exclusion_min_y: -0.25
    rover_exclusion_max_y: 0.25
    rover_exclusion_min_z: -0.15
    rover_exclusion_max_z: 0.35

local_elevation_map_node:
  ros__parameters:
    input_topic: /terrain/filtered_points
    elevation_points_topic: /terrain/elevation_points
    marker_topic: /terrain/elevation_markers
    target_frame: odom
    base_frame: base_footprint
    grid_resolution: 0.05
    grid_length_x: 4.0
    grid_length_y: 4.0
    min_points_per_cell: 2
    elevation_statistic: median
    cell_timeout: 2.0
    publish_rate: 5.0
    marker_cell_thickness: 0.015
    min_visual_elevation: 0.0
    max_visual_elevation: 0.55
    marker_alpha: 0.75
