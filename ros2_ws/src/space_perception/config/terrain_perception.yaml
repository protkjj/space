terrain_pointcloud_filter_node:
  ros__parameters:
    input_topic: /camera/points
    output_topic: /terrain/filtered_points
    target_frame: odom
    base_frame: base_footprint
    publish_rate: 5.0
    voxel_size: 0.03
    min_range: 0.15
    max_range: 4.0
    crop_min_x: 0.10
    crop_max_x: 3.60
    crop_min_y: -2.0
    crop_max_y: 2.0
    crop_min_z: -0.60
    crop_max_z: 1.20
    remove_rover_body: true
    rover_exclusion_min_x: -0.25
    rover_exclusion_max_x: 0.30
    rover_exclusion_min_y: -0.25
    rover_exclusion_max_y: 0.25
    rover_exclusion_min_z: -0.15
    rover_exclusion_max_z: 0.35

local_elevation_map_node:
  ros__parameters:
    input_topic: /terrain/filtered_points
    elevation_points_topic: /terrain/elevation_points
    marker_topic: /terrain/elevation_markers
    target_frame: odom
    base_frame: base_footprint
    grid_resolution: 0.05
    grid_length_x: 4.0
    grid_length_y: 4.0
    min_points_per_cell: 2
    elevation_statistic: median
    cell_timeout: 2.0
    publish_rate: 5.0
    marker_cell_thickness: 0.015
    min_visual_elevation: 0.0
    max_visual_elevation: 0.55
    marker_alpha: 0.75

terrain_feature_node:
  ros__parameters:
    input_topic: /terrain/elevation_points
    output_topic: /terrain/features
    target_frame: odom
    grid_resolution: 0.05
    feature_radius: 0.15
    minimum_neighbors: 5
    minimum_adjacent_neighbors: 2
    maximum_neighbors: 32
    plane_fit_method: svd
    maximum_condition_number: 100.0
    maximum_fit_residual: 0.05
    roughness_method: median_absolute_residual
    step_neighborhood_cells: 1
    confidence_min_point_count: 2
    confidence_target_point_count: 8
    confidence_variance_scale: 0.02
    confidence_residual_scale: 0.02
    publish_rate: 5.0
    diagnostics_topic: /terrain/feature_diagnostics
    marker_alpha: 0.80
    slope_visual_maximum: 0.60
    roughness_visual_maximum: 0.05
    step_visual_maximum: 0.10

# Provisional simulation tuning only; these are not hardware safety limits.
terrain_traversability_node:
  ros__parameters:
    input_topic: /terrain/features
    output_topic: /terrain/traversability
    marker_topic: /terrain/traversability_markers
    diagnostics_topic: /terrain/traversability_diagnostics
    composition_mode: weighted_sum
    slope_free: 0.0872665
    slope_max: 0.523599
    roughness_free: 0.002
    roughness_max: 0.025
    step_free: 0.005
    step_max: 0.056
    variance_free: 0.000025
    variance_max: 0.0004
    coverage_min: 0.60
    confidence_min: 0.10
    minimum_neighbors: 8
    weight_slope: 0.35
    weight_roughness: 0.20
    weight_step: 0.30
    weight_uncertainty: 0.15
    publish_rate: 5.0
    marker_alpha: 0.80
    grid_resolution: 0.05
