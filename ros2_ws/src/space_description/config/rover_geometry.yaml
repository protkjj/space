# THE single source of truth for the rover's physical dimensions.
#
# Read this file; do not re-type its numbers. space_rover.urdf.xacro loads it
# with xacro.load_yaml, and the bringup launch derives every rover-dependent
# threshold from it (nav2 footprint, perception step limit, mission RoverSpec).
#
# WHY THIS FILE EXISTS
# --------------------
# One CAD import (51b34ac, wheel radius 0.112 -> 0.070 m) invalidated four
# values scattered across four packages, and every one of them failed silently
# because the arithmetic downstream still succeeded:
#   space_mission/config/slip.yaml       wheel_radius 0.112 -> slip 1.6x high
#   space_mission slip_estimator_node.py same default, same effect
#   space_perception TraversabilityConfig step_max 0.056 = half the OLD radius
#   space_bringup nav2_params.yaml        footprints sized to the old chassis
# Copying a CAD number into a config is what created each one. So: measured
# primitives live here, and anything computable from them is COMPUTED at load
# time, never stored.
#
# It lives in space_description because that package owns the rover's
# simulator-independent physical description and depends on nothing. Putting it
# in space_mission -- the literal reading of "the RoverSpec YAML is the source"
# -- would make space_description depend on the mission layer to build its own
# URDF, inverting the dependency direction. Same single source, sane layering.
#
# EDITING RULES
# -------------
# 1. Add a value here only if it was MEASURED. If it can be computed from
#    something already here, it belongs in the derivation code, not this file.
# 2. Record how each number was obtained, precisely enough to re-measure it.
# 3. On the next CAD change, edit only this file and re-run the workspace tests.

# --- Wheel, measured from meshes/rover/left_front_wheel.stl ----------------
# Bounding box 140.000 mm across x 40.000 mm wide -> r = 0.070, w = 0.040.
wheel_radius: 0.070
wheel_width: 0.040

# --- Axle centres in base_link, from the CAD assembly ----------------------
# Asymmetric on purpose: the axles are not centred on the chassis. Their
# midpoint (0.00875) is why the mesh visual carries that same x offset.
front_wheel_x: 0.08375
rear_wheel_x: -0.06625
wheel_y: 0.11650
wheel_z: -0.06400

# --- Chassis envelope, measured from meshes/rover/rover_prototype.stl ------
# A full vertex sweep of the mesh (982786 triangles), transformed into the
# ground frame by the same scale/rotation/offset the URDF visual applies.
#
# These replace the old base_length/base_width/base_height box of
# 0.32 x 0.26 x 0.10. That box was wrong in BOTH directions: 15 mm longer than
# the real chassis, and 13 mm NARROWER. Over-size is merely conservative;
# under-size is the dangerous direction, because Gazebo then lets the rover
# through gaps it would physically hit, and judging passable gaps is part of the
# mission. The collision box and the nav2 footprint are now derived from these
# extents instead.
chassis_min_x: -0.15375
chassis_max_x: 0.15146
chassis_half_y: 0.13650

# Highest chassis point above the contact plane.
chassis_top_z: 0.19405

# Lowest chassis point above the contact plane, at (x=+0.000, y=+0.132) -- a
# side rail near mid-length. The old box implied 0.084 m, 2.76x too optimistic,
# and clearance is what decides whether the rover straddles a rock or bellies
# out on it.
#
# Excludes vertices within 30 mm horizontally of an axle: 2984 of them (746 per
# wheel, exactly) are hub and motor bosses reaching 0.008 m BELOW the contact
# plane, 78 mm from the axle against the wheel's own 70 mm. Terrain there meets
# the tyre first, so they do not bound straddling clearance.
#
# The collision box spans clearance..top rather than the full mesh bbox on
# purpose: a box reaching the mesh minimum would dip 8 mm below the ground plane
# and the rover would rest on its chassis instead of its wheels. An
# axis-aligned box cannot represent this chassis exactly; this is the largest
# one that neither under-covers laterally nor clips the ground.
chassis_ground_clearance: 0.030

# --- Sensor mount, from the URDF camera_joint and its collision box --------
# The camera sticks out FURTHER FORWARD than any part of the chassis or wheels,
# so anything that must not intersect the rover has to include it. Leaving it
# out made the derived nav2 footprint 43.8 mm shorter than what Gazebo actually
# collides with -- the dangerous direction, since the planner would then route
# the rover into contact. Worse, the guard test missed it because it checked the
# same two shapes the derivation did; test_footprint_covers_every_collision now
# parses the generated URDF instead of trusting that list.
camera_mount_x: 0.17
camera_collision_length: 0.055
camera_collision_width: 0.025

# --- Mass ------------------------------------------------------------------
# Three different numbers were in play, which is why this block is explicit
# about which is which:
#   3.000 kg  competition CEILING (mission_requirements.md: "3 kg maximum")
#   2.725 kg  design estimate, master document -- the value to simulate
#   2.450 kg  what the URDF actually summed to (1.8 + 4*0.14 + 0.08 + 0.01)
#
# The sim was 10.1% light. That is not cosmetic for this mission: slip is the
# signature measurement, and a rover that is too light slips less, climbs
# better, and generates more traction than the real one -- so a validation run
# on the light model cannot validate the slip logic at all.
#
# mass_total is the authority. mass_base is DERIVED as the remainder, because
# the chassis is the least-known component and the total is the constrained
# quantity; letting the parts define the total is how they drifted apart.
mass_total: 2.725

# Not a design value -- a constraint. A test asserts mass_total stays under it.
mass_limit: 3.0

# Component estimates. Replace with weighed values once the rover is assembled.
mass_wheel: 0.14
mass_camera: 0.08
mass_imu: 0.01

# base_link inertia per kilogram, so it scales with the derived mass instead of
# being a fixed triple that silently describes the old 1.8 kg chassis. Taken
# from the original values divided by their 1.8 kg (0.018/0.022/0.030), which
# preserves the deliberately non-uniform distribution they encoded -- they are
# 1.55x/1.31x/1.18x a uniform box of the same dimensions, reflecting mass
# carried near the perimeter.
base_inertia_per_kg:
  ixx: 0.0100000
  iyy: 0.0122222
  izz: 0.0166667

# --- Terramechanics assumptions --------------------------------------------
# Sinkage assumed when estimating static ground pressure on loose sand. A guess,
# and the weakest input to that estimate; see docs/pending_measurements.md.
assumed_sinkage: 0.005

# --- Derivation policy constants ------------------------------------------
# Not a dimension: the rule that turns wheel_radius into a step limit.
# docs/traversability.md fixed it at half the wheel radius; anchoring the ratio
# here keeps the rule visible while the radius it multiplies stays single-source.
step_limit_per_wheel_radius: 0.5

# Lateral margin added to the rover's own width to get the narrowest gap it
# should be planned through. Skid-steer yaws while translating, so it sweeps
# wider than its static outline.
passable_width_margin: 0.027
