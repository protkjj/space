slip_estimator:
  ros__parameters:
    use_sim_time: true
    joint_states_topic: /joint_states
    # V_actual source. Simulation: Gazebo ground-truth /odom (wheel-independent).
    # Hardware: point this at the OAK-D VIO (/vio/odom). Must NOT be a wheel-
    # fusing estimate, or the slip ratio becomes circular (mission doc 1.3).
    actual_odom_topic: /odom
    # Declares WHICH producer v_actual came from, so a consumer can
    # enforce non-circularity. 'ekf' would be circular: robot_localization
    # fuses wheel encoders. Change to 'vio' on hardware.
    actual_source: sim_ground_truth
    quality_variance_scale: 0.01
    # Contract topic name (docs/dual_rover_traversability.md).
    output_topic: /slip
    diagnostics_topic: /slip/diagnostics
    # wheel_radius is intentionally ABSENT. The node derives it from
    # space_description/config/rover_geometry.yaml, the single source. Setting it
    # here would override that and reintroduce the copy that went stale: this
    # line held 0.112 for the whole life of the 0.070 m CAD wheel, inflating
    # every slip ratio by 1.6x while the arithmetic still succeeded.
    left_wheel_joints: [left_front_wheel_joint, left_rear_wheel_joint]
    right_wheel_joints: [right_front_wheel_joint, right_rear_wheel_joint]
    min_wheel_speed: 0.03
    max_input_age: 0.3
    publish_rate: 10.0
    slip_ema_alpha: 0.3
