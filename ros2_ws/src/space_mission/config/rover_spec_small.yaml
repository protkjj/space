# Our own rover. Values traced to CAD or to CLAUDE.md, not tuned.
#
# Loaded alongside rover_spec_medium.yaml; kept in a separate file so the two
# rovers' parameters cannot be edited into each other by accident (CLAUDE.md,
# dual-rover transform layer, reason 2).
#
# Nested keys flatten to rover_specs.small.<field> as ROS parameters.

traversability_transform:
  ros__parameters:
    rover_specs:
      small:
        rover_id: small
        provenance: measured

        # Design estimate from the master document. NOT 3.0 kg -- that is the
        # competition CEILING (mission_requirements.md: "3 kg maximum"), and
        # using it as the design value made every load-dependent number
        # pessimistic while the sim model was simultaneously 10.1% light at
        # 2.450 kg. Matches space_description/config/rover_geometry.yaml
        # mass_total, which the URDF now sums to exactly.
        # Excludes the marker dispenser; re-weigh after assembly.
        mass_kg: 2.725

        # Measured from meshes/rover/left_front_wheel.stl: 140.000 mm across,
        # 40.000 mm wide. Matches space_rover.urdf.xacro exactly. max_step_
        # height is DERIVED from this radius in rover_spec.py -- do not add a
        # step threshold here, that is the mistake step_max made.
        wheel_radius_m: 0.070
        wheel_width_m: 0.040

        # NOT measured. Static estimate assuming 5 mm sinkage on loose sand:
        #   contact length = 2*sqrt(2*R*z) = 2*sqrt(2*0.070*0.005) = 0.052915 m
        #   patch area     = 0.052915 * 0.040 * 4 wheels = 0.0084664 m^2
        #   pressure       = 2.725 kg * 9.81 / 0.0084664 = 3.157 kPa
        # Was 3.47 kPa, computed from the 3.0 kg competition ceiling instead of
        # the design estimate. rover_geometry.ground_pressure_kpa() derives this
        # so it tracks the mass; the sinkage figure remains a guess, which makes
        # this the weakest field in the block.
        ground_pressure_kpa: 3.157

        # MECHANICAL limit only, and UNCONFIRMED -- needs a ramp test.
        # This name used to cover three different quantities; they are now
        # separated and none is derived from another:
        #   here                                       mechanical capability
        #   verdict.VerdictThresholds.hazard_slope_rad CLAUDE.md 1.4, 20 deg
        #   ScoringConfig.slope_penalty_saturation_rad curve shape, 30 deg
        # 0.349 rad (20 deg) is a CONSERVATIVE PLACEHOLDER, not a measurement:
        # under-claiming capability cannot make the rover attempt a slope it
        # can't hold. When the ramp test lands, replace this with the measured
        # value -- and note that "what fraction of it should the hazard
        # boundary be" is then a separate decision, not an automatic copy.
        max_climb_angle_rad: 0.349

        # Rover width = 2 * (wheel_y + wheel_width/2)
        #             = 2 * (0.11650 + 0.020) = 0.273 m, from the CAD xacro.
        # Plus ~27 mm of steering margin for a skid-steer that yaws while
        # translating.
        min_passable_width_m: 0.300

        # MEASURED from the CAD mesh, not from the collision primitive.
        #
        # The collision box (0.32 x 0.26 x 0.10 centred on base_link, which sits
        # wheel_radius - wheel_z = 0.134 m up) implies 0.084 m of clearance. The
        # real chassis does not: sweeping every vertex of
        # meshes/rover/rover_prototype.stl into the ground frame, the lowest
        # chassis point is 0.03045 m up, at (x=+0.000, y=+0.132) -- a side rail
        # near mid-length. Using the box value would claim 2.76x the clearance
        # the vehicle actually has, and clearance is what decides whether it can
        # straddle a rock instead of bellying out on it.
        #
        # Vertices within 30 mm horizontally of a wheel axle are excluded: 2984
        # of them (746 per wheel, exactly) form the hub/motor bosses and reach
        # 0.008 m BELOW the contact plane, being 78 mm from the axle against the
        # wheel's own 70 mm. Terrain there is met by the tyre first, so they do
        # not bound straddling clearance.
        ground_clearance_m: 0.030

        # UNCONFIRMED. The CAD wheels read as smooth in the STL; confirm
        # against the physical Pololu 37D wheel before trusting any
        # slip-vs-soil interpretation that depends on tread.
        has_grousers: false

        # provenance is 'measured' for the block as a whole, but three fields
        # are weaker than that. They are enumerated by name below rather than
        # described loosely, so a reader can tell exactly which numbers to
        # distrust without re-deriving them.
        provenance_note: >-
          MEASURED (5 fields): wheel_radius_m and wheel_width_m from
          meshes/rover/left_front_wheel.stl, 140.000 x 40.000 mm, matching
          space_rover.urdf.xacro after the 51b34ac CAD import;
          ground_clearance_m from a full vertex sweep of
          meshes/rover/rover_prototype.stl, lowest chassis point 0.03045 m
          (NOT the 0.084 m the collision box implies);
          min_passable_width_m computed from the xacro wheel positions;
          mass_kg is the master document design estimate, matching
          rover_geometry.yaml mass_total.
          .
          NOT CONFIRMED (3 fields, distrust these):
          (1) max_climb_angle_rad -- conservative placeholder, no ramp test has
          been run, so the rover's real climbing limit is unknown;
          (2) has_grousers -- set false because the CAD wheel STL reads as
          smooth, never checked against the physical Pololu 37D wheel, and any
          slip-to-soil interpretation that depends on tread is affected;
          (3) ground_pressure_kpa -- derived, not measured, and it assumes 5 mm
          sinkage on loose sand, which is itself a guess.
          .
          mass_kg additionally excludes the marker dispenser, which is not yet
          mounted; re-weigh once it is. ground_pressure_kpa is listed as
          NOT CONFIRMED above because its sinkage assumption is a guess.
