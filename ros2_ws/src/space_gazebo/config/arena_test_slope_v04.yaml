simulation:
  mesh_scale: [0.001, 0.001, 0.001]
  # CAD is Y-up. Rotate +90 degrees about X: (X,Y,Z) -> (X,-Z,Y).
  orientation_rpy_rad: [1.5707963267948966, 0.0, 0.0]
  # Centre the rotated 3.2 x 4.0 m footprint around the world origin.
  pose_offset_m: [-0.8, -2.0, 0.0]
